<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        .main{
            background-image: url(assest/hm.jpg);
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            background-color: rgba(255, 255, 255, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 10px;
        }
        h1{
            margin: 30px 20px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
        }
        .input1{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .in{
            margin: 10px;
            padding: 10px;
            width: 100%;
        }
        .button{
            margin: 10px;
            padding: 10px;
            width: 100%;
            background-color: rgb(16, 127, 88);
            color: white;
        }
        a{
            padding: 10px;
        }
        .input2{
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
        <form class="box">
            <h1>Account Login</h1>
            <div class="input1">
                <input type="text" placeholder="User Name" class="in">
                <input type="password" placeholder="Password" class="in">
                <input type="submit" value="LOGIN" class="button">
            </div>
            <div class="input2">
                <input type="checkbox" for="ch">
                <label for="ch">remember me</label>
                <a href="forget-password.html">Forget Password?</a>
            </div>
        </form>
    </div>
</body>
</html>
